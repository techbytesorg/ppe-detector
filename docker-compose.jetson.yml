version: '3.8'

services:
  ppe-detector-jetson:
    build:
      context: .
      dockerfile: Dockerfile.jetson
    image: ppe-detector-jetson:latest
    container_name: ppe-detector-jetson-app
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - CUDA_VISIBLE_DEVICES=0
      - OPENCV_DNN_BACKEND=CUDA
      - OPENCV_DNN_TARGET=CUDA
    volumes:
      # Mount input files directory
      - ./input_files:/app/input_files
      # Mount output files directory  
      - ./output_files:/app/output_files
      # Mount models directory
      - ./models:/app/models
      # Mount results directory
      - ./results:/app/results
    devices:
      # CSI cameras on Jetson
      - /dev/video0:/dev/video0
      - /dev/video1:/dev/video1
      # I2C for camera control
      - /dev/i2c-0:/dev/i2c-0
      - /dev/i2c-1:/dev/i2c-1
    privileged: true
    network_mode: host
    stdin_open: true
    tty: true
    
  # Development service for Jetson
  ppe-detector-jetson-dev:
    build:
      context: .
      dockerfile: Dockerfile.jetson
    image: ppe-detector-jetson:latest
    container_name: ppe-detector-jetson-dev
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - CUDA_VISIBLE_DEVICES=0
    volumes:
      - ./:/app
    devices:
      - /dev/video0:/dev/video0
      - /dev/video1:/dev/video1
      - /dev/i2c-0:/dev/i2c-0
      - /dev/i2c-1:/dev/i2c-1
    privileged: true
    network_mode: host
    stdin_open: true
    tty: true
    command: /bin/bash
    profiles:
      - dev